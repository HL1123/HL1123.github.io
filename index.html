    <style type="text/css">
    </style>
    <script>
        var lover = {};
        lover.info = {
            name: "[Click]",
            year: 2021,     //和阳阳相识的具体时间
            month: 7,      //月
            day: 27,        //日
            hour: 23,       //小时
            minute: 59,     //分钟
            second: 0,      //秒
            debug: false,   //调试模式
        }
    </script>

<body>
    <!-- BGM -->
    <audio id="loveBgm" src="bgm.mp3" loop="loop"></audio>  
	<div id="main">
        <div id="error">
            本页面采用HTML5编辑，目前您的浏览器无法显示。
        </div>
		<div id="wrap">
			<div id="text">
				<div id="code">
                    <!-- for yangyang -->
					<span class="say">阳阳：</span><br>
					<span class="say"> </span><br>
                    <span class="say">虽然我现在还不够优秀，但是我会努力变好的。</span><br>
                    <span class="say"> </span><br>
					<span class="say">虽然我不善表达，更不会甜言蜜语，但我会用行动证明一切。</span><br>
                    <span class="say"> </span><br>
					<span class="say">虽然我们认识不久，但是我仍然想对你一辈子好。</span><br>
					<span class="say"> </span><br>
					<span class="say">你老是说我怂，但是有些东西正是因为越在乎才越小心。</span><br>
					<span class="say"> </span><br>
					<span class="say">我不想看见你难过，更不想你因为我难过。</span><br>
					<span class="say"> </span><br>
					<span class="say">我希望你天天开心，希望你快快乐乐的。</span><br>
					<span class="say"> </span><br>
					<span class="say">我老是惹你生气，谢谢你总是包容我，一直原谅我。</span><br>
					<span class="say"> </span><br>
					<span class="say">虽然不知道未来会如何，但我希望无论多久我都能陪在你身边。</span><br>
					<span class="say"> </span><br>
					<span class="say">你给我记住只要你愿意，我永远都在你身边。七夕快乐！</span><br>
					<span class="say"> </span><br>
					<span class="say"> -- 呆呆的牛牛 --</span>
				</div>
			</div>
			<div id="clock-box">
				<span><font color="#666666">阳阳，我们相识到现在已经是</font></span>
				<div id="clock"></div>
			</div>
			<canvas id="canvas" width="1100" height="680"></canvas>
		</div>
	</div>
