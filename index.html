        lover.info = {
            name: "[Click]",
            year: 2023,     //和蓝心媛相识的具体时间

<body>
    <!-- BGM -->
    <audio id="loveBgm" src="bgm.mp3" loop="loop"></audio>
    <div id="main">
        <div id="error">
            本页面采用HTML5编辑，目前您的浏览器无法显示。
        </div>
        <div id="wrap">
            <div id="text">
                <div id="code">
                    <!-- to lxy -->
                    <span class="say">蓝心媛:</span><br>
                    <span class="say"> </span><br>
                    <span class="say">虽然我现在还不够优秀，但是我会努力变好的。</span><br>
                    <span class="say"> </span><br>
                    <span class="say">虽然我们现在是异地，但我会努力冲向你，给你幸福!</span><br>
                    <span class="say"> </span><br>
                    <span class="say">你老是说我画饼大师，但我会用行动证明一切。</span><br>
                    <span class="say"> </span><br>
                    <span class="say">你老说没见过我生气，但有些东西正因为越喜欢才越在乎。</span><br>
                    <span class="say"> </span><br>
                    <span class="say">100 多天说短不短，说长不长，但我真的想一辈子对你好！</span><br>
                    <span class="say"> </span><br>
                    <span class="say">人生短暂，蓝心媛你就是我认准的那个人！</span><br>
                    <span class="say"> </span><br>
                    <span class="say">那个无论发生什么，我都能陪在她身边的人。</span><br>
                    <span class="say"> </span><br>
                    <span class="say">那个和我共度终生的人。</span><br>
                    <span class="say"> </span><br>
                    <span class="say">最后，圣诞快乐！</span><br>
                    <span class="say"> </span><br>
                    <span class="say">记住要给我天天开心，天天爱黄泷！</span><br>
                    <span class="say"> </span><br>
                    <span class="say"> -- 永远爱你的黄泷 --</span>
                </div>
            </div>
            <div id="clock-box">
                <span>
                    <font color="#666666">蓝心媛，我们已经在一起</font>
                </span>
                <div id="clock"></div>
            </div>
            <canvas id="canvas" width="1100" height="680"></canvas>
